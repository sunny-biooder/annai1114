<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>11月14日 忘年会のご案内</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
[hidden] { display: none !important; }
/* 動画を主役に。見出しは小さく、動画は画面の端まで。ボタンは動画の下に小さく一列＋終わったら動画の上に。 */
:root {
  --bg: #efebe4;
  --paper: #fbf9f5;
  --fg: #2e2924;
  --muted: #6d645a;
  --line: #ddd5c9;
  --chestnut: #7a3b22;
  --chestnut-fg: #fdf6ee;
  --moss: #4f5a3a;
  --moss-fg: #f4f4ec;
  --gold: #a8792c;
  --display: "Yuji Syuku", "Yu Mincho", "Hiragino Mincho ProN", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1c1915; --paper: #26221d; --fg: #eee6da; --muted: #b0a596; --line: #3d362e;
  --chestnut: #b5603c; --chestnut-fg: #1c1210; --moss: #8d9a6c; --moss-fg: #161812; --gold: #d3a557; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1c1915; --paper: #26221d; --fg: #eee6da; --muted: #b0a596; --line: #3d362e;
  --chestnut: #b5603c; --chestnut-fg: #1c1210; --moss: #8d9a6c; --moss-fg: #161812; --gold: #d3a557; color-scheme: dark }

html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.7; }
.wrap { max-width: none; margin: 0 auto; min-height: 100svh; box-sizing: border-box; padding-block: 8px; display: grid; gap: 10px; align-content: center; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header { display: flex; align-items: baseline; justify-content: center; gap: 12px; }
.date { font-family: var(--display); font-size: 20px; color: var(--chestnut); letter-spacing: .04em; }
h1 { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.2; margin: 0; letter-spacing: .1em; }

/* 動画は画面の横幅いっぱい（スマホ縦）。横向き・PCでは画面の高さに収まる最大サイズ */
.player { position: relative; background: #000; width: 100%; aspect-ratio: 16 / 9; max-height: 100svh; margin: 0 auto; }
.player { width: min(100%, calc((100svh - 70px) * 16 / 9)); }
.player video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
.after {
  position: absolute; inset: 0; display: grid; place-content: center; gap: 8px; padding: 10px;
  background: rgba(24, 18, 12, .74); color: #fff; text-align: center;
}
.after p { margin: 0 0 2px; font-size: 14px; }
.after .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.after a, .after button {
  font: 700 14px var(--body); border-radius: 999px; padding: 9px 14px; border: 0; cursor: pointer; text-decoration: none;
  background: #fbf9f5; color: #2e2924;
}
.after .again { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.6); font-weight: 500; }
.hint { margin: 0; text-align: center; font-size: 13px; color: var(--muted); }

/* 縦持ちのスマホで再生中は、動画を回して画面いっぱいに（本物の全画面が使えないページのため） */
body.big { overflow: hidden; background: #000; }
body.big .player {
  position: fixed; z-index: 10; left: 50%; top: 50%; margin: 0; max-height: none; aspect-ratio: auto;
  width: 100dvh; height: 100dvw; transform: translate(-50%, -50%) rotate(90deg);
}
body.big .actions { visibility: hidden; }
.close { display: none; position: absolute; z-index: 2; top: 8px; right: 8px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(0,0,0,.5); color: #fff; font-size: 22px; line-height: 40px; cursor: pointer; }
body.big .close { display: block; }

/* 小さなボタン一列 */
.actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 14px;
  border-radius: 999px; text-decoration: none; font-weight: 700; font-size: 14px; line-height: 1.2;
}
.btn svg { flex: none; width: 18px; height: 18px; }
.btn:active { filter: brightness(.95); }
.btn:focus-visible, .after a:focus-visible, .after button:focus-visible, .copy:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.shop { background: var(--chestnut); color: var(--chestnut-fg); }
.map { background: var(--moss); color: var(--moss-fg); }
.menu { background: var(--gold); color: var(--chestnut-fg); }
.tel { background: var(--paper); color: var(--fg); border: 1px solid var(--line); }

.info { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 12px; display: grid; gap: 10px; max-width: 560px; margin: 4px auto 0; box-sizing: border-box; width: calc(100% - 32px); }
.info h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 20px; color: var(--chestnut); }
dl { margin: 0; display: grid; grid-template-columns: 4.2em 1fr; gap: 8px 10px; }
dt { color: var(--muted); font-size: 14px; padding-top: 2px; }
dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
dd .name { font-weight: 700; font-size: 17px; }
.num { font-variant-numeric: tabular-nums; user-select: all; }
.copy { margin-left: 8px; font: 500 13px var(--body); padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.note { margin: 0; font-size: 12px; color: var(--muted); text-align: center; }
.when { margin: 0; text-align: center; font-family: var(--display); font-size: 21px; color: var(--chestnut); letter-spacing: .06em; line-height: 1.4; }
.after .when2 { margin: 0 0 2px; font-family: var(--display); font-size: 19px; color: #fff; letter-spacing: .06em; }
body.big .when { visibility: hidden; }
</style>
</head>
<body>
<div class="wrap">
  <div class="player">
    <video id="v" src="video/annai.mp4?v=132" poster="video/poster.jpg" controls playsinline preload="metadata"></video>
    <button class="close" id="close" type="button" aria-label="小さくする">×</button>
    <div class="after" id="after" hidden>
      <p class="when2">11月14日（土）19時開始</p>
      <p>会場はこちら</p>
      <div class="row">
        <a href="https://www.hotpepper.jp/strJ000064275/" target="_blank" rel="noopener">お店のページ</a>
        <a href="https://www.hotpepper.jp/strJ000064275/course_cnod40/" target="_blank" rel="noopener">コースのメニュー</a>
        <a id="mapLink2" target="_blank" rel="noopener">地図</a>
        <a href="tel:0432388815">電話</a>
      </div>
      <div class="row"><button class="again" id="again" type="button">もう一度見る</button></div>
    </div>
  </div>

  <p class="when pad">11月14日（土）19時開始</p>

  <nav class="actions pad" aria-label="会場のリンク">
    <a class="btn shop" href="https://www.hotpepper.jp/strJ000064275/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16l-1.5-5h-13z"/><path d="M5 10v9h14v-9"/><path d="M10 19v-5h4v5"/></svg>
      お店のページ
    </a>
    <a class="btn menu" href="https://www.hotpepper.jp/strJ000064275/course_cnod40/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
      コースのメニュー
    </a>
    <a class="btn map" id="mapLink" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
      地図
    </a>
    <a class="btn tel" href="tel:0432388815">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
      電話
    </a>
  </nav>

</div>

<script>
(function () {
  var addr = "ダイニングバー ランタン 千葉市中央区新田町11-12 松長ビル";
  var map = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(addr);
  document.getElementById("mapLink").href = map;
  document.getElementById("mapLink2").href = map;
  var v = document.getElementById("v"), after = document.getElementById("after");
  var body = document.body;
  function small() { body.classList.remove("big"); }
  v.addEventListener("ended", function () { small(); after.hidden = false; });
  v.addEventListener("play", function () {
    after.hidden = true;
    // スマホ縦持ちのときだけ、動画を横に回して画面いっぱいにする
    if (matchMedia("(orientation: portrait) and (max-width: 700px)").matches) body.classList.add("big");
  });
  document.getElementById("close").addEventListener("click", function () { v.pause(); small(); });
  document.getElementById("again").addEventListener("click", function () { v.currentTime = 0; v.play(); });
})();
</script>
</body>
</html>
